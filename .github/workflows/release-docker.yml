name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v1.1.0-rc3); defaults to the git ref name"
        required: false
        default: ""

env:
  DOCKER_CLI_EXPERIMENTAL: enabled
  # Publish to GHCR under the repository owner, so forks publish to
  # their own namespace with the built-in GITHUB_TOKEN and no external
  # registry credentials.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bisonwallet

permissions:
  contents: read
  packages: write # pushing the image to GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-22.04

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout project
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 #v6.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 #v3.7.0

      - name: Setup Docker buildx action
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 #v3.11.1

      - name: Build and Push Docker Image
        run: |
          TAG="${{ inputs.tag }}"
          # GHCR requires a lowercase repository name.
          IMAGE="$(echo "${{ env.IMAGE_NAME }}:${TAG:-${{ github.ref_name }}}" | tr '[:upper:]' '[:lower:]')"
          docker buildx build  \
            -f client/Dockerfile.release \
            --platform linux/arm64,linux/amd64 \
            --tag "$IMAGE" \
            --output "type=registry" .
          # Print the published reference with its manifest digest, for
          # pinning in dcrdex-umbrel/docker-compose.yml.
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "Published ${IMAGE}@${DIGEST}"
