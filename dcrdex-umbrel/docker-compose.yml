version: "3.7"

services:
  app_proxy:
    environment:
# DCRDEX uses its own auth
      PROXY_AUTH_ADD: "false"
# The app proxy resolves the web container as <app-id>_web_1, so this
# must match the id in umbrel-app.yml.
      APP_HOST: dcrdex-umbrel_web_1
      APP_PORT: 5758

  web:
# This image is published by the release-docker.yml workflow, which
# prints the digest to pin here after each publish.
    image: ghcr.io/peterzen/bisonwallet-test:v1.1.0-rc3@sha256:06d2e852cb7676d48a71101f5f4202aba92136a227285524371faa480959a3c2
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/dex/.dexc
# When a trade is being settled, the DEX client requires time
# to shut down cleanly due to the time sensitive nature of atomic
# swaps, hence the long stop_grace_period value.
    stop_grace_period: 15m
    entrypoint: ["/bin/sh", "-c", "exec ./bisonw --webaddr $(hostname -I|cut -d\\  -f1 ):5758"]
